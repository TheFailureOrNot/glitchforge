name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxkbcommon-dev libwayland-dev libudev-dev libssl-dev libgtk-3-dev
      - name: Format source
        run: cargo fmt --all
      - name: Run tests
        run: cargo test --all-targets
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features
      - name: Build release binary
        run: cargo build --release
