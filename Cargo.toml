[package]
name = "glitchforge"
version = "0.1.0"
edition = "2021"
description = "A deterministic image-artifact and stylisation laboratory"
license = "MIT"
readme = "README.md"
default-run = "glitchforge"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
eframe = "0.29.1"
egui = "0.29.1"
image = { version = "0.25.5", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif"] }
kamadak-exif = "0.6.1"
jpeg-encoder = "0.7.1"
rand = "0.8.5"
rand_chacha = "0.3.1"
rfd = "0.15.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.13"
webp = "0.3.0"


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev]
opt-level = 1

[[bin]]
name = "glitchforge"
path = "src/main.rs"
